name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout skills from core repo
        uses: actions/checkout@v4
        with:
          repository: kuaiyou-app/kuaiyou-open-source
          path: _skills_src
          sparse-checkout: |
            skills
          sparse-checkout-cone-mode: false
        continue-on-error: true

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync skills
        run: npm run sync-skills

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
